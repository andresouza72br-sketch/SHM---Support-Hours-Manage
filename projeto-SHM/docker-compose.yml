version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shm_db}
      POSTGRES_USER: ${POSTGRES_USER:-shm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shm_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: shm_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-shm_user}:${POSTGRES_PASSWORD:-shm_password}@db:5432/${POSTGRES_DB:-shm_db}
      - DEBUG=True
      - SECRET_KEY=django-insecure-shm-dev-key-change-in-production
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      - db

volumes:
  postgres_data:
