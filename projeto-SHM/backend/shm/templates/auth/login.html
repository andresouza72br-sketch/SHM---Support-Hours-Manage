{% extends "base.html" %}

{% block title %}Login — SHM{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-900">Acesse o SHM</h1>
        <p class="text-sm text-slate-500 mt-1">Gestão e controle de horas técnicas de suporte</p>
    </div>

    <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_username" class="block text-sm font-medium text-slate-700">E-mail</label>
            <input type="email" name="username" id="id_username" required autofocus class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div>
            <label for="id_password" class="block text-sm font-medium text-slate-700">Senha</label>
            <input type="password" name="password" id="id_password" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
            Entrar no Sistema
        </button>
    </form>
</div>
{% endblock %}
