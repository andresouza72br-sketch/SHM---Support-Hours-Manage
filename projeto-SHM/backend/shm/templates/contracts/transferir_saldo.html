{% extends "base.html" %}

{% block title %}Transferência de Saldo (Rollover) — SHM{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-8">
    <div class="border-b border-slate-100 pb-4 mb-6">
        <h1 class="text-xl font-bold text-slate-900">Transferência de Saldo / Rollover</h1>
        <p class="text-xs text-slate-500 mt-1">Transfira o saldo remanescente (+ ou -) de um contrato anterior para um novo contrato do mesmo cliente.</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label for="contrato_origem" class="block text-sm font-semibold text-slate-700">Contrato de Origem (Vencido)</label>
            <select name="contrato_origem" id="contrato_origem" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md text-sm">
                <option value="">Selecione o contrato encerrado...</option>
                {% for c in contratos_origem %}
                <option value="{{ c.id }}">{{ c.cliente.nome_fantasia }} — {{ c.numero_contrato }} (Saldo: {{ c.saldo_horas }}h)</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="contrato_destino" class="block text-sm font-semibold text-slate-700">Contrato de Destino (Ativo)</label>
            <select name="contrato_destino" id="contrato_destino" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md text-sm">
                <option value="">Selecione o novo contrato...</option>
                {% for c in contratos_destino %}
                <option value="{{ c.id }}">{{ c.cliente.nome_fantasia }} — {{ c.numero_contrato }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="motivo" class="block text-sm font-semibold text-slate-700">Motivo / Justificativa</label>
            <textarea name="motivo" id="motivo" rows="3" required placeholder="Ex: Renovação anual de horas técnicas" class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
            <a href="{% url 'contract_list' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">Cancelar</a>
            <button type="submit" class="px-6 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-lg shadow-sm transition">
                Confirmar Transferência
            </button>
        </div>
    </form>
</div>
{% endblock %}
