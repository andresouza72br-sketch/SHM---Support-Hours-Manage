<div id="timeline-container" class="space-y-3">
    {% for item in timeline %}
    <div class="flex gap-3 text-xs">
        <div class="w-2 h-2 rounded-full mt-1.5 
            {% if item.tipo_evento == 'ACEITE' %}bg-blue-600
            {% elif item.tipo_evento == 'APROVACAO' %}bg-emerald-500
            {% elif item.tipo_evento == 'REJEICAO' %}bg-rose-500
            {% elif item.tipo_evento == 'MUDANCA_STATUS' %}bg-purple-500
            {% else %}bg-slate-400{% endif %}">
        </div>
        <div class="flex-1 bg-white p-3 rounded-lg border border-slate-200">
            <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                <span class="font-semibold text-slate-700">{% if item.autor %}{{ item.autor.nome_completo }}{% else %}Sistema{% endif %}</span>
                <span>{{ item.created_at|date:"d/m/Y H:i" }}</span>
            </div>
            <div class="text-slate-800">{{ item.conteudo }}</div>
        </div>
    </div>
    {% empty %}
    <p class="text-xs text-slate-400 italic">Nenhum evento registrado na timeline.</p>
    {% endfor %}
</div>
